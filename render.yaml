# LinguaFlow AI — Render Blueprint
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance → chọn repo GitHub

databases:
  - name: linguaflow-db
    databaseName: linguaflow
    user: linguaflow
    plan: free

services:
  # ── Backend API (NestJS + Prisma) ──
  - type: web
    name: linguaflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: linguaflow-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: linguaflow-web
          envVarKey: RENDER_EXTERNAL_URL

  # ── Frontend (Next.js) ──
  - type: web
    name: linguaflow-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        fromService:
          type: web
          name: linguaflow-api
          envVarKey: RENDER_EXTERNAL_URL
