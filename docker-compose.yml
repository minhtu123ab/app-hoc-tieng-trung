services:
  postgres:
    image: postgres:16-alpine
    container_name: linguaflow-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: linguaflow
      POSTGRES_PASSWORD: linguaflow
      POSTGRES_DB: linguaflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
